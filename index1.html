.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #eef3d6;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}

.ta,.sel{width:100%;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff;font:inherit;font-size:15px;margin:4px 0 8px;color:var(--ink)}
.ta{min-height:46px;resize:vertical}

.opt.sel{background:var(--g1);border-color:var(--g2)}
.stepper .qty{flex:1;width:auto;min-width:0;border:2px solid var(--line);font-size:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SQL_BASE=String.raw`-- Provisão: banco de dados do seu grupo (login por usuário e senha, sem e-mail).
-- Como usar: cole este arquivo inteiro em Supabase > SQL Editor e clique em Run.
-- ATENÇÃO: este texto contém as senhas provisórias e o código de recuperação do seu grupo.
-- Não publique nem compartilhe este arquivo. Cada casa troca a senha no primeiro acesso.

create extension if not exists pgcrypto with schema extensions;

-- ------------------------------------------------------------------
-- Tabelas (fechadas: o app só acessa por meio das funções abaixo)
-- ------------------------------------------------------------------
create table if not exists public.prov_casas (
  id            smallint primary key,
  nome          text not null,
  usuario       text not null unique,
  senha_hash    text,
  admin         boolean not null default false,
  ordem         smallint not null,
  ativa_desde   text,
  ativa_ate     text,
  tentativas    smallint not null default 0,
  bloqueada_ate timestamptz,
  trocar_senha  boolean not null default true
);

create table if not exists public.prov_sessoes (
  token   uuid primary key default gen_random_uuid(),
  casa_id smallint not null references public.prov_casas(id) on delete cascade,
  criada  timestamptz not null default now(),
  expira  timestamptz not null default now() + interval '30 days'
);

create table if not exists public.prov_estoque (
  casa_id    smallint not null references public.prov_casas(id) on delete cascade,
  mes        text not null,
  item       text not null,
  comprada   numeric not null default 0,
  armazenada numeric not null default 0,
  usada      numeric not null default 0,
  atualizado timestamptz not null default now(),
  primary key (casa_id, mes, item),
  constraint prov_estoque_ordem check (usada >= 0 and usada <= armazenada and armazenada <= comprada)
);

create table if not exists public.prov_alerta (
  id    smallint primary key check (id = 1),
  ativo boolean not null default false,
  por   smallint references public.prov_casas(id),
  em    timestamptz
);
insert into public.prov_alerta (id, ativo) values (1, false) on conflict (id) do nothing;

create table if not exists public.prov_estoque_grupo (
  mes        text not null,
  item       text not null,
  comprada   numeric not null default 0,
  armazenada numeric not null default 0,
  usada      numeric not null default 0,
  atualizado timestamptz not null default now(),
  primary key (mes, item),
  constraint prov_estoque_grupo_ordem check (usada >= 0 and usada <= armazenada and armazenada <= comprada)
);

create table if not exists public.prov_config (
  id          smallint primary key check (id = 1),
  meta_meses  smallint not null default 6,
  meta_prazo  smallint not null default 6,
  meta_inicio text     not null default '@@INICIO@@',
  perfil      jsonb,
  rec_hash    text
);
insert into public.prov_config (id) values (1) on conflict (id) do nothing;

alter table public.prov_config enable row level security;
alter table public.prov_estoque_grupo enable row level security;
alter table public.prov_alerta  enable row level security;
alter table public.prov_casas   enable row level security;
alter table public.prov_sessoes enable row level security;
alter table public.prov_estoque enable row level security;

revoke all on table public.prov_casas, public.prov_sessoes, public.prov_estoque, public.prov_alerta, public.prov_estoque_grupo, public.prov_config from public, anon, authenticated;

@@CASAS@@

-- ------------------------------------------------------------------
-- Funções internas (não ficam expostas ao app)
-- ------------------------------------------------------------------
create or replace function public.prov_sessao(p_token uuid)
returns public.prov_casas
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
begin
  select c.* into v_casa
  from public.prov_sessoes s
  join public.prov_casas c on c.id = s.casa_id
  where s.token = p_token and s.expira > now();
  if not found then
    raise exception 'Sessão expirada. Entre de novo.';
  end if;
  return v_casa;
end;
$$;

create or replace function public.prov_definir_senha(p_usuario text, p_senha text)
returns void
language plpgsql
security definer
set search_path = public, extensions
as $$
begin
  if length(coalesce(p_senha, '')) < 6 then
    raise exception 'A senha precisa ter pelo menos 6 caracteres.';
  end if;
  update public.prov_casas
     set senha_hash = crypt(p_senha, gen_salt('bf', 10)),
         tentativas = 0,
         bloqueada_ate = null,
         trocar_senha = true
   where usuario = lower(trim(p_usuario));
  if not found then
    raise exception 'Usuário não encontrado.';
  end if;
end;
$$;

-- ------------------------------------------------------------------
-- Funções usadas pelo app
-- ------------------------------------------------------------------
create or replace function public.app_login(p_usuario text, p_senha text)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa  public.prov_casas;
  v_token uuid;
begin
  select * into v_casa from public.prov_casas where usuario = lower(trim(p_usuario));
  if not found or v_casa.senha_hash is null then
    perform pg_sleep(0.4);
    return json_build_object('erro', 'Usuário ou senha incorretos.');
  end if;

  if v_casa.bloqueada_ate is not null and v_casa.bloqueada_ate > now() then
    return json_build_object('erro', 'Muitas tentativas. Aguarde alguns minutos e tente de novo.');
  end if;

  if v_casa.senha_hash = crypt(coalesce(p_senha, ''), v_casa.senha_hash) then
    update public.prov_casas set tentativas = 0, bloqueada_ate = null where id = v_casa.id;
    delete from public.prov_sessoes where expira < now();
    insert into public.prov_sessoes (casa_id) values (v_casa.id) returning token into v_token;
    return json_build_object('token', v_token);
  end if;

  if v_casa.tentativas + 1 >= 5 then
    update public.prov_casas set tentativas = 0, bloqueada_ate = now() + interval '5 minutes' where id = v_casa.id;
  else
    update public.prov_casas set tentativas = tentativas + 1 where id = v_casa.id;
  end if;
  return json_build_object('erro', 'Usuário ou senha incorretos.');
end;
$$;

create or replace function public.app_estado(p_token uuid)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object(
      'me', json_build_object('id', v_casa.id, 'nome', v_casa.nome, 'admin', v_casa.admin, 'trocar', true),
      'casas', '[]'::json, 'estoque', '[]'::json);
  end if;
  return json_build_object(
    'me', json_build_object('id', v_casa.id, 'nome', v_casa.nome, 'admin', v_casa.admin, 'trocar', false),
    'casas', (
      select coalesce(json_agg(json_build_object(
               'id', id, 'nome', nome, 'ordem', ordem, 'desde', ativa_desde, 'ate', ativa_ate
             ) order by ordem), '[]'::json)
      from public.prov_casas
    ),
    'estoque', (
      select coalesce(json_agg(json_build_object(
               'casa_id', casa_id, 'mes', mes, 'item', item,
               'c', comprada, 'a', armazenada, 'u', usada
             )), '[]'::json)
      from public.prov_estoque
    ),
    'meta', (select json_build_object('meses', meta_meses, 'prazo', meta_prazo, 'inicio', meta_inicio)
               from public.prov_config where id = 1),
    'perfil', (select perfil from public.prov_config where id = 1),
    'grupo', (
      select coalesce(json_agg(json_build_object(
               'mes', mes, 'item', item, 'c', comprada, 'a', armazenada, 'u', usada
             )), '[]'::json)
      from public.prov_estoque_grupo
    ),
    'alerta', (
      select json_build_object('ativo', a.ativo, 'por', c.nome, 'em', a.em)
      from public.prov_alerta a
      left join public.prov_casas c on c.id = a.por
      where a.id = 1
    )
  );
end;
$$;

create or replace function public.app_set_qty(
  p_token uuid, p_casa smallint, p_mes text, p_item text,
  p_c numeric, p_a numeric, p_u numeric
)
returns void
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    raise exception 'Troque a senha provisória antes de continuar.';
  end if;
  if not (v_casa.admin or v_casa.id = p_casa) then
    raise exception 'Você só pode alterar a lista da sua casa.';
  end if;
  if p_mes !~ '^\d{4}-\d{2}$' or length(coalesce(p_item, '')) = 0 or length(p_item) > 80 then
    raise exception 'Dados inválidos.';
  end if;
  if p_u < 0 or p_u > p_a or p_a > p_c then
    raise exception 'As quantidades não fecham: usado, armazenado e comprado precisam seguir essa ordem.';
  end if;
  insert into public.prov_estoque (casa_id, mes, item, comprada, armazenada, usada, atualizado)
  values (p_casa, p_mes, p_item, p_c, p_a, p_u, now())
  on conflict (casa_id, mes, item) do update
    set comprada = excluded.comprada,
        armazenada = excluded.armazenada,
        usada = excluded.usada,
        atualizado = now();
end;
$$;

create or replace function public.app_set_casa(p_token uuid, p_casa smallint, p_desde text, p_ate text)
returns void
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    raise exception 'Troque a senha provisória antes de continuar.';
  end if;
  if not v_casa.admin then
    raise exception 'Só a casa administradora pode ativar ou desativar casas.';
  end if;
  if (p_desde is not null and p_desde !~ '^\d{4}-\d{2}$') or (p_ate is not null and p_ate !~ '^\d{4}-\d{2}$') then
    raise exception 'Mês inválido.';
  end if;
  update public.prov_casas set ativa_desde = p_desde, ativa_ate = p_ate where id = p_casa;
end;
$$;

create or replace function public.app_trocar_senha(p_token uuid, p_atual text, p_nova text)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.senha_hash is null or v_casa.senha_hash <> crypt(coalesce(p_atual, ''), v_casa.senha_hash) then
    return json_build_object('erro', 'A senha atual não confere.');
  end if;
  if length(coalesce(p_nova, '')) < 6 then
    return json_build_object('erro', 'A nova senha precisa ter pelo menos 6 caracteres.');
  end if;
  if p_nova = p_atual then
    return json_build_object('erro', 'Escolha uma senha diferente da provisória.');
  end if;
  update public.prov_casas set senha_hash = crypt(p_nova, gen_salt('bf', 10)), trocar_senha = false where id = v_casa.id;
  return json_build_object('ok', true);
end;
$$;

create or replace function public.app_redefinir_senha(p_token uuid, p_casa smallint, p_nova text)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  if not v_casa.admin then
    return json_build_object('erro', 'Só a casa administradora pode redefinir senhas.');
  end if;
  if length(coalesce(p_nova, '')) < 6 then
    return json_build_object('erro', 'A senha precisa ter pelo menos 6 caracteres.');
  end if;
  update public.prov_casas
     set senha_hash = crypt(p_nova, gen_salt('bf', 10)), tentativas = 0, bloqueada_ate = null,
         trocar_senha = (id <> v_casa.id)
   where id = p_casa;
  delete from public.prov_sessoes where casa_id = p_casa and casa_id <> v_casa.id;
  return json_build_object('ok', true);
end;
$$;

create or replace function public.app_mover(
  p_token uuid, p_mes text, p_item text, p_acao text, p_qtd numeric
)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
  v public.prov_estoque_grupo;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  if p_mes !~ '^\d{4}-\d{2}$' or length(coalesce(p_item, '')) = 0 or length(p_item) > 80
     or coalesce(p_qtd, 0) <= 0 or p_qtd > 100000 then
    return json_build_object('erro', 'Dados inválidos.');
  end if;
  insert into public.prov_estoque_grupo (mes, item) values (p_mes, p_item) on conflict do nothing;
  select * into v from public.prov_estoque_grupo where mes = p_mes and item = p_item for update;
  if p_acao = 'comprar' then v.comprada := v.comprada + p_qtd;
  elsif p_acao = 'guardar' then v.armazenada := v.armazenada + p_qtd;
  elsif p_acao = 'usar' then v.usada := v.usada + p_qtd;
  elsif p_acao = 'v-comprar' then v.comprada := v.comprada - p_qtd;
  elsif p_acao = 'v-guardar' then v.armazenada := v.armazenada - p_qtd;
  elsif p_acao = 'v-usar' then v.usada := v.usada - p_qtd;
  else return json_build_object('erro', 'Ação inválida.');
  end if;
  if v.usada < 0 or v.usada > v.armazenada or v.armazenada > v.comprada then
    return json_build_object('erro', 'Essa quantidade não cabe: o estoque mudou. Atualize a tela e tente de novo.');
  end if;
  update public.prov_estoque_grupo
     set comprada = v.comprada, armazenada = v.armazenada, usada = v.usada, atualizado = now()
   where mes = p_mes and item = p_item;
  return json_build_object('c', v.comprada, 'a', v.armazenada, 'u', v.usada);
end;
$$;

create or replace function public.app_set_meta(p_token uuid, p_meses smallint, p_prazo smallint, p_inicio text)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  if not v_casa.admin then
    return json_build_object('erro', 'Só a casa administradora pode mudar a meta.');
  end if;
  if p_meses is null or p_meses < 1 or p_meses > 24 or p_prazo is null or p_prazo < 1 or p_prazo > 24
     or p_inicio is null or p_inicio !~ '^20\d{2}-(0[1-9]|1[0-2])$' then
    return json_build_object('erro', 'Meta inválida.');
  end if;
  update public.prov_config
     set meta_meses = p_meses, meta_prazo = p_prazo, meta_inicio = p_inicio
   where id = 1;
  return json_build_object('ok', true);
end;
$$;

create or replace function public.app_alerta(p_token uuid, p_senha text, p_ativar boolean)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  if v_casa.bloqueada_ate is not null and v_casa.bloqueada_ate > now() then
    return json_build_object('erro', 'Muitas tentativas. Aguarde alguns minutos e tente de novo.');
  end if;
  if v_casa.senha_hash is null or v_casa.senha_hash <> crypt(coalesce(p_senha, ''), v_casa.senha_hash) then
    if v_casa.tentativas + 1 >= 5 then
      update public.prov_casas set tentativas = 0, bloqueada_ate = now() + interval '5 minutes' where id = v_casa.id;
    else
      update public.prov_casas set tentativas = tentativas + 1 where id = v_casa.id;
    end if;
    return json_build_object('erro', 'Senha incorreta.');
  end if;
  update public.prov_casas set tentativas = 0, bloqueada_ate = null where id = v_casa.id;
  update public.prov_alerta
     set ativo = coalesce(p_ativar, false),
         por = case when coalesce(p_ativar, false) then v_casa.id else null end,
         em = now()
   where id = 1 and ativo is distinct from coalesce(p_ativar, false);
  return json_build_object('ok', true);
end;
$$;

-- ------------------------------------------------------------------
-- Documentos e saúde
-- ------------------------------------------------------------------
create table if not exists public.prov_docs (
  id       uuid primary key default gen_random_uuid(),
  casa_id  smallint not null references public.prov_casas(id) on delete cascade,
  pessoa   text,
  tipo     text not null check (tipo in ('id','saude','receita','plano','vacina','bem','outro')),
  titulo   text not null,
  mime     text not null,
  tamanho  integer not null,
  liberado boolean not null default false,
  dados    bytea not null,
  criado   timestamptz not null default now()
);
create table if not exists public.prov_saude (
  casa_id      smallint not null references public.prov_casas(id) on delete cascade,
  pessoa       text not null,
  alergias     text not null default '',
  doencas      text not null default '',
  pode         text not null default '',
  nao_pode     text not null default '',
  sangue       text not null default '',
  extras       jsonb not null default '[]'::jsonb,
  revisado_mes text,
  atualizado   timestamptz not null default now(),
  primary key (casa_id, pessoa)
);
alter table public.prov_docs  enable row level security;
alter table public.prov_saude enable row level security;
revoke all on table public.prov_docs, public.prov_saude from public, anon, authenticated;

-- Regra: RG/CNH ('id') e saúde básica ('saude') de todas as casas abrem para todos durante o alerta.
-- Os demais só abrem para a própria casa, ou para todos se a casa liberar.

create or replace function public.app_docs_listar(p_token uuid)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
  v_alerta boolean;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then return '[]'::json; end if;
  select coalesce(ativo, false) into v_alerta from public.prov_alerta where id = 1;
  return (
    select coalesce(json_agg(json_build_object(
      'id', x.id, 'casa_id', x.casa_id, 'casa', c.nome, 'pessoa', x.pessoa, 'tipo', x.tipo,
      'titulo', case when x.abrir then x.titulo else null end,
      'mime', x.mime, 'tam', x.tamanho,
      'liberado', (x.liberado or x.tipo in ('id','saude')),
      'minha', x.casa_id = v_casa.id, 'abrir', x.abrir
    ) order by c.ordem, x.pessoa nulls last, x.criado), '[]'::json)
    from (
      select d.id, d.casa_id, d.pessoa, d.tipo, d.titulo, d.mime, d.tamanho, d.liberado, d.criado,
             (d.casa_id = v_casa.id or (v_alerta and (d.tipo in ('id','saude') or d.liberado))) as abrir
        from public.prov_docs d
    ) x
    join public.prov_casas c on c.id = x.casa_id
    where x.casa_id = v_casa.id or v_alerta
  );
end;
$$;

create or replace function public.app_doc_enviar(
  p_token uuid, p_pessoa text, p_tipo text, p_titulo text, p_mime text, p_dados text, p_liberado boolean
)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
  v_id uuid;
  v_bytes bytea;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  if p_tipo not in ('id','saude','receita','plano','vacina','bem','outro')
     or p_mime not in ('image/jpeg','image/png','application/pdf')
     or length(coalesce(trim(p_titulo), '')) = 0 or length(p_titulo) > 80
     or length(coalesce(p_pessoa, '')) > 60
     or p_dados is null or length(p_dados) < 100 or length(p_dados) > 5200000 then
    return json_build_object('erro', 'Arquivo ou dados inválidos.');
  end if;
  if (select count(*) from public.prov_docs where casa_id = v_casa.id) >= 300 then
    return json_build_object('erro', 'Limite de documentos da casa atingido.');
  end if;
  v_bytes := decode(p_dados, 'base64');
  insert into public.prov_docs (casa_id, pessoa, tipo, titulo, mime, tamanho, liberado, dados)
  values (v_casa.id, nullif(trim(p_pessoa), ''), p_tipo, trim(p_titulo), p_mime, length(v_bytes),
          coalesce(p_liberado, false) or p_tipo in ('id','saude'), v_bytes)
  returning id into v_id;
  return json_build_object('id', v_id);
end;
$$;

create or replace function public.app_doc_abrir(p_token uuid, p_id uuid)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
  v_alerta boolean;
  d public.prov_docs;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  select coalesce(ativo, false) into v_alerta from public.prov_alerta where id = 1;
  select * into d from public.prov_docs where id = p_id;
  if not found
     or not (d.casa_id = v_casa.id or (v_alerta and (d.tipo in ('id','saude') or d.liberado))) then
    return json_build_object('erro', 'Este documento não está disponível para a sua casa.');
  end if;
  return json_build_object('mime', d.mime, 'titulo', d.titulo,
                           'dados', replace(encode(d.dados, 'base64'), E'\n', ''));
end;
$$;

create or replace function public.app_doc_liberar(p_token uuid, p_id uuid, p_lib boolean)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
  d public.prov_docs;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  select * into d from public.prov_docs where id = p_id and casa_id = v_casa.id;
  if not found then return json_build_object('erro', 'Documento não encontrado.'); end if;
  if d.tipo in ('id','saude') then
    return json_build_object('erro', 'Este tipo de documento é sempre compartilhado em caso de alerta.');
  end if;
  update public.prov_docs set liberado = coalesce(p_lib, false) where id = p_id;
  return json_build_object('ok', true);
end;
$$;

create or replace function public.app_saude_listar(p_token uuid)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
  v_alerta boolean;
  v_mes text := to_char(now() at time zone 'America/Sao_Paulo', 'YYYY-MM');
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('mes', v_mes, 'pessoas', '[]'::json, 'resumo', '[]'::json);
  end if;
  select coalesce(ativo, false) into v_alerta from public.prov_alerta where id = 1;
  return json_build_object(
    'mes', v_mes,
    'pessoas', (
      select coalesce(json_agg(json_build_object(
        'casa_id', s.casa_id, 'casa', c.nome, 'pessoa', s.pessoa,
        'alergias', s.alergias, 'doencas', s.doencas, 'pode', s.pode, 'nao_pode', s.nao_pode,
        'sangue', s.sangue,
        'extras', case when s.casa_id = v_casa.id then s.extras else '[]'::jsonb end,
        'revisado_mes', s.revisado_mes, 'minha', s.casa_id = v_casa.id
      ) order by c.ordem, s.pessoa), '[]'::json)
      from public.prov_saude s join public.prov_casas c on c.id = s.casa_id
      where s.casa_id = v_casa.id or v_alerta
    ),
    'resumo', (
      select coalesce(json_agg(json_build_object(
        'casa_id', c.id, 'casa', c.nome,
        'total', (select count(*) from public.prov_saude s where s.casa_id = c.id),
        'revisados', (select count(*) from public.prov_saude s where s.casa_id = c.id and s.revisado_mes = v_mes)
      ) order by c.ordem), '[]'::json)
      from public.prov_casas c
    )
  );
end;
$$;

create or replace function public.app_saude_salvar(
  p_token uuid, p_pessoa text, p_alergias text, p_doencas text, p_pode text, p_nao_pode text, p_sangue text, p_extras jsonb
)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
  v_mes text := to_char(now() at time zone 'America/Sao_Paulo', 'YYYY-MM');
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  if length(coalesce(trim(p_pessoa), '')) = 0 or length(p_pessoa) > 60
     or length(coalesce(p_alergias, '')) > 1000 or length(coalesce(p_doencas, '')) > 1000
     or length(coalesce(p_pode, '')) > 1000 or length(coalesce(p_nao_pode, '')) > 1000
     or length(coalesce(p_sangue, '')) > 20
     or jsonb_typeof(coalesce(p_extras, '[]'::jsonb)) <> 'array'
     or jsonb_array_length(coalesce(p_extras, '[]'::jsonb)) > 12
     or length(coalesce(p_extras, '[]'::jsonb)::text) > 4000 then
    return json_build_object('erro', 'Dados inválidos.');
  end if;
  if (select count(*) from public.prov_saude where casa_id = v_casa.id) >= 20
     and not exists (select 1 from public.prov_saude where casa_id = v_casa.id and pessoa = trim(p_pessoa)) then
    return json_build_object('erro', 'Limite de pessoas da casa atingido.');
  end if;
  insert into public.prov_saude (casa_id, pessoa, alergias, doencas, pode, nao_pode, sangue, extras, revisado_mes, atualizado)
  values (v_casa.id, trim(p_pessoa), coalesce(p_alergias, ''), coalesce(p_doencas, ''), coalesce(p_pode, ''),
          coalesce(p_nao_pode, ''), coalesce(p_sangue, ''), coalesce(p_extras, '[]'::jsonb), v_mes, now())
  on conflict (casa_id, pessoa) do update
    set alergias = excluded.alergias, doencas = excluded.doencas, pode = excluded.pode,
        nao_pode = excluded.nao_pode, sangue = excluded.sangue, extras = excluded.extras,
        revisado_mes = v_mes, atualizado = now();
  return json_build_object('ok', true);
end;
$$;

-- ------------------------------------------------------------------
-- Perfil do grupo, novas casas e recuperação da senha do administrador
-- ------------------------------------------------------------------
create or replace function public.app_set_perfil(p_token uuid, p_perfil jsonb)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  if not v_casa.admin then
    return json_build_object('erro', 'Só a casa administradora pode mudar as respostas do plano.');
  end if;
  if p_perfil is null or jsonb_typeof(p_perfil) <> 'object' or length(p_perfil::text) > 20000 then
    return json_build_object('erro', 'Dados inválidos.');
  end if;
  update public.prov_config set perfil = p_perfil where id = 1;
  return json_build_object('ok', true);
end;
$$;

create or replace function public.app_nova_casa(p_token uuid, p_nome text, p_usuario text, p_senha text, p_desde text)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_casa public.prov_casas;
  v_id smallint;
  v_user text := lower(trim(coalesce(p_usuario, '')));
begin
  v_casa := public.prov_sessao(p_token);
  if v_casa.trocar_senha then
    return json_build_object('erro', 'Troque a senha provisória antes de continuar.');
  end if;
  if not v_casa.admin then
    return json_build_object('erro', 'Só a casa administradora pode adicionar casas.');
  end if;
  if length(coalesce(trim(p_nome), '')) = 0 or length(p_nome) > 40
     or v_user !~ '^[a-z0-9._-]{2,30}$'
     or length(coalesce(p_senha, '')) < 6
     or (p_desde is not null and p_desde !~ '^\d{4}-\d{2}$') then
    return json_build_object('erro', 'Dados inválidos. O usuário usa só letras minúsculas, números, ponto, hífen e sublinhado.');
  end if;
  if exists (select 1 from public.prov_casas where usuario = v_user) then
    return json_build_object('erro', 'Esse usuário já existe.');
  end if;
  if (select count(*) from public.prov_casas) >= 20 then
    return json_build_object('erro', 'Limite de casas atingido.');
  end if;
  select coalesce(max(id), 0) + 1 into v_id from public.prov_casas;
  insert into public.prov_casas (id, nome, usuario, admin, ordem, ativa_desde, senha_hash, trocar_senha)
  values (v_id, trim(p_nome), v_user, false, v_id, p_desde, crypt(p_senha, gen_salt('bf', 10)), true);
  return json_build_object('ok', true, 'id', v_id);
end;
$$;

create or replace function public.app_recuperar(p_codigo text, p_nova text)
returns json
language plpgsql
security definer
set search_path = public, extensions
as $$
declare
  v_adm  public.prov_casas;
  v_hash text;
  v_cod  text := upper(regexp_replace(coalesce(p_codigo, ''), '[^A-Za-z0-9]', '', 'g'));
begin
  select * into v_adm from public.prov_casas where admin order by ordem limit 1;
  if not found then
    return json_build_object('erro', 'Código inválido.');
  end if;
  if v_adm.bloqueada_ate is not null and v_adm.bloqueada_ate > now() then
    return json_build_object('erro', 'Muitas tentativas. Aguarde alguns minutos e tente de novo.');
  end if;
  select rec_hash into v_hash from public.prov_config where id = 1;
  if v_hash is null or v_hash <> crypt(v_cod, v_hash) then
    if v_adm.tentativas + 1 >= 5 then
      update public.prov_casas set tentativas = 0, bloqueada_ate = now() + interval '5 minutes' where id = v_adm.id;
    else
      update public.prov_casas set tentativas = tentativas + 1 where id = v_adm.id;
    end if;
    return json_build_object('erro', 'Código inválido.');
  end if;
  if length(coalesce(p_nova, '')) < 6 then
    return json_build_object('erro', 'A nova senha precisa ter pelo menos 6 caracteres.');
  end if;
  update public.prov_casas
     set senha_hash = crypt(p_nova, gen_salt('bf', 10)), tentativas = 0, bloqueada_ate = null, trocar_senha = false
   where id = v_adm.id;
  delete from public.prov_sessoes where casa_id = v_adm.id;
  return json_build_object('ok', true, 'usuario', v_adm.usuario);
end;
$$;

grant execute on function public.app_recuperar(text, text) to anon, authenticated;

function perfilPadrao(){return {v:1,casaNome:'Minha casa',casas:1,adultos:2,idosos:0,adol:0,criancas:0,bebes:0,gest:0,mulh:0,lac:0,glu:0,cont:false,dieta:'onivora',
  moradia:'casa',espaco:'medio',umido:false,prat:true,gas:true,carvao:false,
  poco:'nao',refugio:'nao',veic:0,terra:'nenhum',cult:{hortalicas:false,feijoes:false,cereais:false,raizes:false,frutas:false,ovos:false},
  meses:6,prazo:6,inicio:hojeMes()};}
function normPerfil(p){const d=perfilPadrao();const o=Object.assign(d,p||{});o.cult=Object.assign(d.cult,(p&&p.cult)||{});
  const c=(v,a,b)=>Math.max(a,Math.min(b,Math.round(Number(v)||0)));
  o.adultos=c(o.adultos,0,40);o.idosos=c(o.idosos,0,40);o.adol=c(o.adol,0,40);o.criancas=c(o.criancas,0,40);o.bebes=c(o.bebes,0,20);
  if(pessoas(o)<1)o.adultos=1;
  const n=pessoas(o);o.gest=c(o.gest,0,o.adultos+o.idosos);o.mulh=c(o.mulh,0,n);o.lac=c(o.lac,0,n);o.glu=c(o.glu,0,n);
  o.casas=c(o.casas,1,20);o.veic=c(o.veic,0,30);o.meses=c(o.meses,1,24);o.prazo=c(o.prazo,1,24);
  o.casaNome=String(o.casaNome||'Minha casa').slice(0,40);return o;}
function pessoas(p){return p.adultos+p.idosos+p.adol+p.criancas+p.bebes;}
function aeDe(p){return p.adultos+p.idosos*0.9+p.adol*1.2+p.criancas*0.6+p.bebes*0.3+p.gest*0.2;}
function ppDe(p){return p.adultos+p.idosos+p.adol+p.criancas*0.8+p.bebes*0.3;}
function terraOk(p){return p.terra!=='nenhum';}
function cultOk(p,x){return terraOk(p)&&!!p.cult[x]&&(p.terra!=='vasos'||x==='hortalicas');}
function algumCult(p){return CULTS.some(c=>cultOk(p,c[0]));}
function carroOk(p){return p.refugio==='sim'&&p.veic>0;}
function condOk(c,p){
  if(!c)return true;
  if(c.slice(0,2)==='c:')return cultOk(p,c.slice(2));
  switch(c){
    case 'lac':return p.lac>0;case 'glu':return p.glu>0;case 'prat':return p.prat;case 'umido':return p.umido;
    case 'gas':return p.gas;case 'carvao':return p.carvao;case 'poco':case 'pocoE':return p.poco==='quer';
    case 'cult':return algumCult(p);case 'veic':return carroOk(p);case 'veic2':return carroOk(p)&&p.veic>1;
    case 'bebe1':return p.bebes>0;case 'kids':return p.criancas+p.bebes>0;case 'gest':return p.gest>0;case 'cont':return p.cont;case 'mulh':return p.mulh>0;
  }
  return true;
}
function fatorEsc(c,p){
  switch(c.esc){case 'N12':return pessoas(p)/12;case 'unico':return 1;case 'casas':return p.casas/c.ref;case 'veic':return p.veic/c.ref;
    case 'bebe1':return p.bebes;case 'kids3':return (p.criancas+p.bebes)/3;case 'gest':return p.gest;case 'mulh':return p.mulh/c.ref;}
  return 1;
}
function redutorPlantio(p){
  const f=TERRAS[p.terra].v;const r={};if(f>=1)return r;
  CAT.forEach(c=>{if(c.cat!=='Alimentos')return;
    if((cultOk(p,'feijoes')&&/^feijao/.test(c.id))||(cultOk(p,'cereais')&&/^(arroz|milho|canjica|fuba|farinha-de-milho)/.test(c.id))||(cultOk(p,'raizes')&&/mandioca/.test(c.id))||(cultOk(p,'hortalicas')&&c.mod==='hort'))r[c.id]=f;});
  return r;
}
function gerarItens(p0){
  const p=normPerfil(p0);const A=aeDe(p),PP=ppDe(p),n=pessoas(p),red=redutorPlantio(p);const out=[];
  CAT.forEach(c=>{
    if(!condOk(c.cond,p))return;
    let q1=0,q2=0;
    if(c.modo==='ae'){
      let u=A;
      if(c.mod==='trigo')u=A*(1-Math.min(1,p.glu/n));
      else if(c.mod==='semgluten')u=p.glu;
      else if(c.mod==='leitepo'){u=p.dieta==='vegana'?0:A*(1-Math.min(1,p.lac/n));}
      else if(c.mod==='animal'){u=p.dieta==='onivora'?A:0;}
      else if(c.mod==='vegmais'){u=p.dieta==='vegetariana'?A*1.3:(p.dieta==='vegana'?A*1.5:A);}
      if(c.cond==='lac')u=p.lac;
      q2=c.base*u*(red[c.id]||1);q1=q2/4;
    }else if(c.modo==='pp'){q2=c.base*PP;q1=q2/4;}
    else if(c.modo==='fix'){const f=fatorEsc(c,p);q1=c.q1*f;q2=c.q2*f;}
    if(c.modo!=='calc'&&q1<=0&&q2<=0)return;
    const it={id:c.id,nome:c.nome,cat:c.cat,sub:c.sub,un:c.un,step:c.step,arm:c.arm,obs:c.obs,peso:c.peso,dist:c.dist,q1:r3(q1),q2:r3(q2)};
    if(c.extremo)it.extremo=true;
    out.push(it);
  });
  const pr=out.find(x=>x.id.indexOf('prateleiras')===0);
  if(pr){
    const kg=N=>out.reduce((s,x)=>s+(x.cat==='Alimentos'&&x.un==='kg'?qtdMeta(x,N)*(x.peso||1):0),0)*1.15;
    pr.q1=Math.max(1,Math.ceil(kg(3)/500));pr.q2=Math.max(1,Math.ceil(kg(12)/500));
  }
  return out;
}
function volumeLitros(items,N){
  let v=0;
  items.forEach(it=>{
    if(it.cat==='Estrutura'||it.cat==='Plantio'||it.id.indexOf('prateleiras')===0)return;
    const T=qtdMeta(it,N);if(T<=0)return;
    if(it.un==='kg'){const kg=T*(it.peso||1);v+=it.arm==='Garrafa PET'?kg/P.kgGarrafa*3.3:(it.arm==='Balde+Mylar'?kg/P.kgBalde*24:kg*1.8);}
    else if(/^galao-de-(agua|combustivel)/.test(it.id))v+=T*24;
    else if(/^botijao/.test(it.id)||/^caixa-plastica/.test(it.id))v+=T*60;
    else if(it.un==='l')v+=T*1.2;
    else v+=T*0.8;
  });
  return v;
}
function cabeMeses(p,items){let m=0;const lim=ESPACOS[p.espaco].m3*1000*0.85;for(let N=1;N<=24;N++){if(volumeLitros(items,N)<=lim)m=N;else break;}return m;}

 open(){return new Promise((ok,no)=>{if(LDB.db)return ok(LDB.db);let r;try{r=indexedDB.open('provL',1);}catch(e){return no(e);}r.onupgradeneeded=()=>{r.result.createObjectStore('docs',{keyPath:'id'});};r.onsuccess=()=>{LDB.db=r.result;ok(LDB.db);};r.onerror=()=>no(r.error);});},

 put(o){return LDB.tx('readwrite',s=>s.put(o));},
 get(id){return LDB.tx('readonly',s=>s.get(id)).catch(()=>null);},
 del(id){return LDB.tx('readwrite',s=>s.delete(id)).catch(()=>{});},
 clear(){return LDB.tx('readwrite',s=>s.clear()).catch(()=>{});}
};

async function rpcLocal(n,a){
  const L=Lget();if(!L||!L.perfil)throw new Error('Dados locais não encontrados.');
  const nome=L.perfil.casaNome;const hoje=hojeMes();

      meta:L.meta,grupo:Object.keys(L.grupo).map(k=>{const v=L.grupo[k];return Object.assign(par(k),{c:v.c,a:v.a,u:v.u});}),
      alerta:{ativo:!!L.alerta.ativo,por:nome,em:L.alerta.em},perfil:L.perfil};

    L.est['1|'+a.p_mes+'|'+a.p_item]={c:a.p_c,a:a.p_a,u:a.p_u};Lsave();return null;}
  case 'app_mover':{
    const k=a.p_mes+'|'+a.p_item;const v=Object.assign({c:0,a:0,u:0},L.grupo[k]);const q=a.p_qtd;
    if(!(q>0))return {erro:'Dados inválidos.'};
    if(a.p_acao==='comprar')v.c=r3(v.c+q);else if(a.p_acao==='guardar')v.a=r3(v.a+q);else if(a.p_acao==='usar')v.u=r3(v.u+q);
    else if(a.p_acao==='v-comprar')v.c=r3(v.c-q);else if(a.p_acao==='v-guardar')v.a=r3(v.a-q);else if(a.p_acao==='v-usar')v.u=r3(v.u-q);
    else return {erro:'Ação inválida.'};
    if(v.u<0||v.u>v.a+1e-9||v.a>v.c+1e-9)return {erro:'Essa quantidade não cabe: o estoque mudou. Atualize a tela e tente de novo.'};
    L.grupo[k]=v;Lsave();return {c:v.c,a:v.a,u:v.u};}
  case 'app_set_meta':{L.meta={meses:a.p_meses,prazo:a.p_prazo,inicio:a.p_inicio};L.perfil.meses=a.p_meses;L.perfil.prazo=a.p_prazo;L.perfil.inicio=a.p_inicio;Lsave();return {ok:true};}
  case 'app_set_perfil':{L.perfil=a.p_perfil;Lsave();return {ok:true};}
  case 'app_alerta':{L.alerta={ativo:!!a.p_ativar,em:new Date().toISOString()};Lsave();return {ok:true};}
  case 'app_docs_listar':return L.docs.map(d=>({id:d.id,casa_id:1,casa:nome,pessoa:d.pessoa,tipo:d.tipo,titulo:d.titulo,mime:d.mime,tam:d.tam,liberado:!!d.liberado||d.tipo==='id'||d.tipo==='saude',minha:true,abrir:true}));
  case 'app_doc_enviar':{
    if(L.docs.length>=300)return {erro:'Limite de documentos atingido.'};
    const id=idLocal();
    try{await LDB.put({id:id,mime:a.p_mime,titulo:a.p_titulo,dados:a.p_dados});}catch(e){return {erro:'Não consegui guardar o arquivo neste celular. Libere espaço e tente de novo.'};}
    L.docs.push({id:id,pessoa:a.p_pessoa||null,tipo:a.p_tipo,titulo:a.p_titulo,mime:a.p_mime,tam:Math.round(a.p_dados.length*0.75),liberado:!!a.p_liberado});Lsave();return {id:id};}
  case 'app_doc_abrir':{const o=await LDB.get(a.p_id);if(!o)return {erro:'Documento não encontrado neste celular.'};return {mime:o.mime,titulo:o.titulo,dados:o.dados};}
  case 'app_doc_liberar':{const d=L.docs.find(x=>x.id===a.p_id);if(d){d.liberado=!!a.p_lib;Lsave();}return {ok:true};}
  case 'app_doc_apagar':{L.docs=L.docs.filter(x=>x.id!==a.p_id);Lsave();await LDB.del(a.p_id);return {ok:true};}
  case 'app_saude_listar':{
    const pes=L.saude.map(s=>({casa_id:1,casa:nome,pessoa:s.pessoa,alergias:s.alergias,doencas:s.doencas,pode:s.pode,nao_pode:s.nao_pode,sangue:s.sangue,extras:s.extras||[],revisado_mes:s.revisado_mes,minha:true}));

  case 'app_saude_salvar':{
    const o={pessoa:String(a.p_pessoa).trim(),alergias:a.p_alergias||'',doencas:a.p_doencas||'',pode:a.p_pode||'',nao_pode:a.p_nao_pode||'',sangue:a.p_sangue||'',extras:a.p_extras||[],revisado_mes:hoje};
    const i=L.saude.findIndex(s=>s.pessoa===o.pessoa);if(i>=0)L.saude[i]=o;else L.saude.push(o);Lsave();return {ok:true};}
  case 'app_saude_ok':{const s=L.saude.find(x=>x.pessoa===a.p_pessoa);if(s){s.revisado_mes=hoje;Lsave();}return {ok:true};}
  case 'app_saude_remover':{L.saude=L.saude.filter(x=>x.pessoa!==a.p_pessoa);Lsave();return {ok:true};}

}
async function rpc(nome,args){
  if(MODO==='local')return rpcLocal(nome,args||{});

  let r;

    r=await fetch(CONN.url+'/rest/v1/rpc/'+nome,{method:'POST',headers:{'apikey':CONN.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  }catch(e){throw new Error('Sem conexão. Verifique a internet e tente de novo.');}
  let j=null;try{j=await r.json();}catch(e){}

  return j;
}

function urlNorm(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;return u.replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');}
function chaveMsg(k){
  k=String(k||'').trim();if(!k)return 'Cole a chave pública do projeto.';
  if(/^sb_secret_/.test(k))return 'Essa é a chave secreta. Não use essa chave aqui. Copie a chave pública (publishable ou anon).';
  if(/^sb_publishable_/.test(k))return '';
  if(/^eyJ/.test(k)){
    try{const j=JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if(j.role==='service_role')return 'Essa é a chave service_role, que dá acesso total ao banco. Não use essa chave aqui. Copie a chave anon (pública).';
      if(j.role&&j.role!=='anon')return 'Essa chave não é a chave pública (anon).';
    }catch(e){return 'Chave inválida.';}
    return '';
  }
  return 'Chave inválida. A chave pública começa com sb_publishable_ ou eyJ.';
}
function urlMsg(u){
  if(!u)return 'Cole o endereço do projeto.';
  try{const x=new URL(u);if(x.protocol!=='https:'&&!(x.protocol==='http:'&&/^(localhost|127\.0\.0\.1)$/.test(x.hostname)))return 'O endereço precisa começar com https://';}catch(e){return 'Endereço inválido.';}
  return '';
}

const ALFA='abcdefghjkmnpqrstuvwxyz23456789';
function aleat(n,alfa){const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,x=>alfa[x%alfa.length]).join('');}
function senhaProv(){return aleat(4,ALFA)+'-'+aleat(4,ALFA);}
function codigoRec(){return aleat(16,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789').match(/.{4}/g).join('-');}
function slugUser(n){const s=String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/^casa\s+(?:(?:de|da|do)\s+)?/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);return s.length>=2?s:'casa-'+(s||'x');}
function usuariosUnicos(nomes,usados){const u=new Set(usados||[]);return nomes.map(n=>{const b=slugUser(n);let x=b,i=2;while(u.has(x))x=b+i++;u.add(x);return x;});}
function sqlq(s){return "'"+String(s).replace(/'/g,"''")+"'";}
function gerarSQL(casas,rec,inicio){
  const vals=casas.map((c,i)=>'  ('+(i+1)+', '+sqlq(c.nome)+', '+sqlq(c.usuario)+', '+(i===0?'true':'false')+', '+(i+1)+', '+sqlq(inicio)+')').join(',\n');
  const ins='insert into public.prov_casas (id, nome, usuario, admin, ordem, ativa_desde) values\n'+vals+'\non conflict (id) do nothing;';
  const sen=casas.map(c=>'update public.prov_casas set senha_hash = extensions.crypt('+sqlq(c.senha)+", extensions.gen_salt('bf', 10)), trocar_senha = true where usuario = "+sqlq(c.usuario)+' and senha_hash is null;').join('\n')+
    '\nupdate public.prov_config set rec_hash = extensions.crypt('+sqlq(rec.replace(/-/g,''))+", extensions.gen_salt('bf', 10)) where id = 1 and rec_hash is null;";
  return SQL_BASE.replace('@@INICIO@@',()=>inicio).replace('@@CASAS@@',()=>ins).replace('@@SENHAS@@',()=>sen);
}
async function copiar(txt){
  try{await navigator.clipboard.writeText(txt);return true;}catch(e){}
  try{const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');document.body.removeChild(t);return ok;}catch(e){return false;}
}

function passosReenvio(L){
  const passos=[];const meu=S.me.id;
  if(S.me.admin&&!PERFIL&&L.perfil){
    passos.push({k:'perfil',rot:'Respostas do plano',fn:async()=>{
      await chk(rpc('app_set_perfil',{p_token:S.token,p_perfil:L.perfil}));
      await chk(rpc('app_set_meta',{p_token:S.token,p_meses:L.meta.meses,p_prazo:L.meta.prazo,p_inicio:L.meta.inicio}));}});
  }
  Object.keys(L.grupo).forEach(k=>{const v=L.grupo[k];if(!(v.c>0))return;const p=k.split('|');
    passos.push({k:'g:'+k,rot:'Estoque',fn:async()=>{
      const sv=S.estG[k];if(sv&&Number(sv.c)>0)return 'pulou';
      const acoes=[['comprar',v.c],['guardar',v.a],['usar',v.u]];
      for(const x of acoes){if(x[1]>0)await chk(rpc('app_mover',{p_token:S.token,p_mes:p[0],p_item:p[1],p_acao:x[0],p_qtd:r3(x[1])}));}}});});
  Object.keys(L.est).forEach(k=>{const v=L.est[k];if(!(v.c>0))return;const p=k.split('|');
    passos.push({k:'t:'+k,rot:'Conferências',fn:async()=>{await chk(rpc('app_set_qty',{p_token:S.token,p_casa:meu,p_mes:p[1],p_item:p[2],p_c:v.c,p_a:v.a,p_u:v.u}));}});});
  L.saude.forEach(s=>passos.push({k:'s:'+s.pessoa,rot:'Saúde',fn:async()=>{
    if(S.saude.pessoas.some(x=>x.minha&&x.pessoa===s.pessoa))return 'pulou';
    await chk(rpc('app_saude_salvar',{p_token:S.token,p_pessoa:s.pessoa,p_alergias:s.alergias,p_doencas:s.doencas,p_pode:s.pode,p_nao_pode:s.nao_pode,p_sangue:s.sangue,p_extras:s.extras||[]}));}}));
  L.docs.forEach(d=>passos.push({k:'d:'+d.id,rot:'Documento '+d.titulo,fn:async()=>{
    const o=await LDB.get(d.id);if(!o)throw new Error('Arquivo "'+d.titulo+'" não está mais neste celular.');
    await chk(rpc('app_doc_enviar',{p_token:S.token,p_pessoa:d.pessoa,p_tipo:d.tipo,p_titulo:d.titulo,p_mime:d.mime,p_dados:o.dados,p_liberado:!!d.liberado}));}}));
  return passos;
}
async function reenviar(){
  const R=S.reenvio;if(!R||R.fase==='enviando')return;
  const L=Lget();if(!L){S.reenvio=null;render();return;}
  R.fase='enviando';R.erros=[];R.pulados=0;R.feitos=0;
  if(!S.docsOk)await carregarDocs();
  const passos=passosReenvio(L);R.total=passos.length;render();
  for(const p of passos){
    if(L.feito[p.k]){R.feitos++;continue;}
    try{const r=await p.fn();if(r==='pulou')R.pulados++;L.feito[p.k]=true;Lsave();R.feitos++;}
    catch(e){R.erros.push((p.rot||'Item')+': '+e.message);}
    render();
  }
  if(!R.erros.length){
    Lapagar();S.reenvio=null;S.docsOk=false;await carregar(true);await carregarDocs();render();
    toast(R.pulados?'Dados enviados. '+R.pulados+(R.pulados===1?' item já tinha dados no banco e foi mantido.':' itens já tinham dados no banco e foram mantidos.'):'Dados enviados para o seu banco.');
  }else{R.fase='erro';render();}
}

// quantidade total de um item para N meses de provisão (reta entre a cesta de 3 e a de 12 meses)
function qtdMeta(it,N){
  const raw=Math.max(0,it.q1+(it.q2-it.q1)/9*(N-3));
  return r3(Math.ceil(raw/it.step-1e-9)*it.step);
}
function fracAcum(it,k){
  const n=META.prazo;if(k>=n)return 1;
  if(it.dist==='cedo')return Math.min(1,k/Math.max(1,Math.ceil(n/3)));
  return k/n;
}
function alvoAcum(it,k,T){
  if(k>=META.prazo)return T;
  return r3(Math.round(T*fracAcum(it,k)/it.step)*it.step);
}
function derivados(kgG,kgB){
  const gar=Math.ceil(kgG/P.kgGarrafa-1e-9), bal=Math.ceil(kgB/P.kgBalde-1e-9);
  const abs=Math.ceil((gar*P.absGarrafa+bal*P.absBalde)*(1+P.margemAbs)-1e-9);
  return {gar:Math.max(gar,0),bal:Math.max(bal,0),abs:Math.max(abs,0)};
}

function mesRef(m){if(m!=='0000-00')return m;const h=hojeMes();return h<MESES[0].id?MESES[0].id:h;}
function casaAtiva(c,m){m=mesRef(m);return !!c.desde&&c.desde<=m&&(!c.ate||m<=c.ate);}
function ativas(m){return S.casas.filter(c=>casaAtiva(c,m)).sort((a,b)=>a.ordem-b.ordem);}

function partesDe(q,step,seed,m){
  const act=ativas(m);const n=act.length;if(!n)return [];
  const units=Math.round(q/step);const base=Math.floor(units/n);const rem=units-base*n;
  const rot=(seed+Math.max(mesIdx(m),0))%n;
  return act.map((c,idx)=>({id:c.id,nome:c.nome.replace(/^Casa /,''),q:r3((base+((((idx-rot)%n)+n)%n<rem?1:0))*step)}));
}
function sugestao(it,m){
  const seed=it.idx!=null?it.idx:(it.id==='emb-garrafas'?1001:(it.id==='emb-baldes'?1002:1003));
  const p=partesDe(it.q,it.step,seed,m).filter(x=>x.q>0);if(!p.length)return '';
  const todas=partesDe(it.q,it.step,seed,m);
  if(p.length===todas.length&&p.every(x=>x.q===p[0].q))return 'Sugestão: '+fmt(p[0].q)+' '+it.un+' por casa';
  return 'Sugestão: '+p.map(x=>(S.me&&x.id===S.me.id?'<b>'+esc(x.nome)+' '+fmt(x.q)+'</b>':esc(x.nome)+' '+fmt(x.q))).join(' · ')+' '+esc(it.un);
}
function haver(id){const e=S.estG[MES_ST+'|'+id];return e?r3(Number(e.c)):0;}
function linhas(m){
  const out=[];let kgG=0,kgB=0,cG=0,cB=0,tG=0,tB=0,pSoma=0,pN=0,completos=0;
  const real=m!=='0000-00';const k=real?mesIdx(m)+1:0;
  if(real&&k<=0)return {lista:[],kgG:0,kgB:0,gar:0,bal:0,abs:0,pSoma:0,pN:0,completos:0};
  ITEMS.forEach((it,i)=>{
    const T=qtdMeta(it,META.meses);if(T<=0)return;
    const av=it.dist==='avulso';if(av===real)return;
    const C=av?T:alvoAcum(it,k,T);const c=haver(it.id);
    const need=r3(Math.max(0,C-c));
    if(it.un==='kg'&&it.arm==='Garrafa PET'){cG+=C*(it.peso||1);tG+=T*(it.peso||1);if(need>0)kgG+=need*(it.peso||1);}
    if(it.un==='kg'&&it.arm==='Balde+Mylar'){cB+=C*(it.peso||1);tB+=T*(it.peso||1);if(need>0)kgB+=need*(it.peso||1);}
    if(C>0){pSoma+=Math.min(1,c/C);pN++;}
    if(c>=T)completos++;
    if(need>0)out.push({id:it.id,idx:i,nome:it.nome,cat:it.cat,sub:it.sub,un:it.un,step:it.step,preco:it.preco,arm:it.arm,obs:it.obs,q:need,T:T,peso:it.peso,extremo:it.extremo,dist:it.dist});
  });
  let gar=0,bal=0,abs=0;
  if(real){
    const dc=derivados(cG,cB),dt=derivados(tG,tB);
    const vals={gar:[dc.gar,dt.gar],bal:[dc.bal,dt.bal],abs:[dc.abs,dt.abs]};
    EMB.forEach(e=>{const need=Math.max(0,vals[e.k][0]-haver(e.id));if(need>0)out.push(embLinha(e,need,vals[e.k][1]));if(e.k==='gar')gar=need;if(e.k==='bal')bal=need;if(e.k==='abs')abs=need;});
  }
  return {lista:out,kgG:kgG,kgB:kgB,gar:gar,bal:bal,abs:abs,pSoma:pSoma,pN:pN,completos:completos};
}
// itens com algum estoque registrado (comprado, guardado ou usado), de qualquer mês
function itensEstoque(){
  const out=[];
  ITEMS.forEach((it,i)=>{const T=qtdMeta(it,META.meses);const e=S.estG[MES_ST+'|'+it.id];
    if(e&&Number(e.c)>0)out.push({id:it.id,idx:i,nome:it.nome,cat:it.cat,sub:it.sub,un:it.un,step:it.step,preco:it.preco,arm:it.arm,obs:it.obs,q:0,T:T,peso:it.peso,extremo:it.extremo,dist:it.dist});});
  EMB.forEach(e=>{const x=S.estG[MES_ST+'|'+e.id];if(x&&Number(x.c)>0)out.push(embLinha(e,0,0));});
  return out;
}
function estado(it){
  const e=S.estG[MES_ST+'|'+it.id]||{c:0,a:0,u:0};
  const c=r3(Number(e.c)), a=r3(Number(e.a)), u=r3(Number(e.u));
  return {c:c,a:a,u:u,comprar:r3(it.q||0),comprado:r3(c-a),armazenado:r3(a-u),usado:u};
}
function resumo(m){
  const L=linhas(m);const cnt={comprar:L.lista.length,comprado:0,armazenado:0,usado:0};
  itensEstoque().forEach(it=>{const s=estado(it);['comprado','armazenado','usado'].forEach(k=>{if(s[k]>0)cnt[k]++;});});
  return {L:L,cnt:cnt,pct:L.pN?Math.round(L.pSoma/L.pN*100):100};
}

function aplicar(r){

  if(r.meta){const nm={meses:Number(r.meta.meses),prazo:Number(r.meta.prazo),inicio:r.meta.inicio};if(nm.meses!==META.meses||nm.prazo!==META.prazo||nm.inicio!==META.inicio){META=nm;montarMeses();}}
  if(!MESES.find(x=>x.id===S.mes))S.mes=defaultMes();

  S.est=mp;if(S.casaId==null)S.casaId=r.me.id;

      const pend=lsJson('prov_pend')||(Lget()&&Lget().perfil);
      if(pend){try{await chk(rpc('app_set_perfil',{p_token:S.token,p_perfil:pend}));const q=normPerfil(pend);await chk(rpc('app_set_meta',{p_token:S.token,p_meses:q.meses,p_prazo:q.prazo,p_inicio:q.inicio}));lsDel('prov_pend');lsDel('prov_setup');return carregar(silencioso);}catch(e){toast(e.message);}}

    if(c&&c.me){aplicar(c);S.offline=true;S.boot=false;if(!S.docsOk)docsDepois();}
    else{S.boot=false;if(!silencioso)toast(e.message);}
    render();
  }
}

function agregado(){
  const out=[];
  ITEMS.forEach(it=>{const T=qtdMeta(it,META.meses);if(T<=0)return;
    const e=S.estG[MES_ST+'|'+it.id]||{c:0,a:0,u:0};
    out.push({it:it,q:T,c:Number(e.c),a:Number(e.a),u:Number(e.u)});});
  return out;
}
function prio(it){
  if(it.derivado||it.sub==='Poço manual'||it.cat==='Estrutura'||it.cat==='Embalagem')return 0;
  if(it.cat==='Saúde'||it.cat==='Bebê')return 1;
  if(it.cat==='Transporte')return 2;
  if(it.cat==='Água e cozinha')return /galao-de-agua|pastilhas|filtro-de-barro|botijao|lanterna|pilhas|galao-de-combustivel/.test(it.id)?1:2;
  if(it.cat==='Alimentos')return /arroz|feij|oleo|(^|-)sal(-|$)|acucar|leite/.test(it.id)?1:2;
  return 2;
}
function emerg(){
  const E={kg:0,galoesComb:0,walkies:0,itens:0,comprar1:[],comprar2:[]};
  agregado().forEach(o=>{
    const it=o.it;const tenho=r3(o.c-o.u);const falta=r3(o.q-o.c);
    if(tenho>0){E.itens++;
      if(it.un==='kg'&&it.cat==='Alimentos')E.kg+=tenho*(it.peso||1);
      if(it.id==='galao-de-agua-20-l-reserva')E.kg+=tenho*20;
      if(it.id.indexOf('galao-de-combustivel')===0)E.galoesComb+=tenho;
      if(it.id==='walkie-talkie-par')E.walkies+=tenho;}
    const pr=prio(it);
    if(falta>0&&pr===1)E.comprar1.push({it:it,q:falta});
    else if(falta>0&&pr===2)E.comprar2.push({it:it,q:falta});
  });
  return E;
}

function lerQtd(str,step,lim){
  let q=parseFloat(String(str).replace(',','.'));
  if(!(q>0))return {ok:false};
  q=Math.round(q/step)*step;if(q<=0)q=step;
  return {ok:true,q:r3(Math.min(q,lim)),acima:q>lim+1e-9};
}

  return t.r(fmt(r3(R.lim-x.q))+' '+R.un);
}

// ---- handlers dos fluxos ----
function iniciarWiz(modo,p){W={p:normPerfil(p||perfilPadrao()),passo:1,modo:modo,intent:null};S.fluxo='wiz';render();window.scrollTo(0,0);}
function voltarFluxo(){
  const f=S.fluxo;
  if(f==='wiz'){if(W.passo>1)W.passo--;else if(W.modo==='editar')S.fluxo=null;else S.fluxo='boas';}
  else if(f==='resumo')S.fluxo='wiz';
  else if(f==='escolha')S.fluxo='resumo';
  else if(f==='conectar')S.fluxo=(W&&W.intent==='entrar')?'boas':(W&&W.modo==='editar'?null:'escolha');
  else if(f==='casas')S.fluxo='conectar';
  else if(f==='sql')S.fluxo='casas';
  S.erro='';render();window.scrollTo(0,0);
}
function fluxoClick(a,b){
  const v=b.dataset.v,k=b.dataset.k;
  if(a==='boas-ok'){iniciarWiz('novo');return true;}
  if(a==='boas-entrar'){W={p:perfilPadrao(),passo:1,modo:'novo',intent:'entrar'};S.cx={url:'',key:'',erro:'',busy:false};S.fluxo='conectar';render();return true;}
  if(a==='w-volta'){voltarFluxo();return true;}
  if(a==='w-d'){const d=Number(b.dataset.d);
    if(k==='inicio'){const n=somaMes(W.p.inicio,d);if(n>=somaMes(hojeMes(),-1)&&n<=somaMes(hojeMes(),24))W.p.inicio=n;}
    else{W.p[k]=(Number(W.p[k])||0)+d;}
    W.p=normPerfil(W.p);render();return true;}
  if(a==='w-tg'){W.p[k]=!W.p[k];render();return true;}
  if(a==='w-set'){W.p[k]=v;if(k==='refugio'&&v==='nao')W.p.veic=0;render();return true;}
  if(a==='w-cult'){W.p.cult[v]=!W.p.cult[v];render();return true;}
  if(a==='w-prox'){W.p=normPerfil(W.p);if(W.passo<5){W.passo++;}else S.fluxo='resumo';render();window.scrollTo(0,0);return true;}
  if(a==='w-fim'){
    W.p=normPerfil(W.p);
    if(W.modo==='editar'){salvarEdicao();return true;}
    S.fluxo='escolha';render();window.scrollTo(0,0);return true;
  }
  if(a==='esc-local'){
    const p=normPerfil(W.p);p.casas=Math.max(1,p.casas);Lcriar(p);MODO='local';lsSet('prov_modo','local');
    setPerfil(p);META={meses:p.meses,prazo:p.prazo,inicio:p.inicio};montarMeses();S.mes=defaultMes();
    S.token='local';S.fluxo=null;S.boot=true;S.inited=false;S.tab='inicio';S.casaId=null;render();carregar();return true;
  }
  if(a==='esc-shared'){W.intent='criar';S.cx={url:'',key:'',erro:'',busy:false};S.fluxo='conectar';render();window.scrollTo(0,0);return true;}
  if(a==='z-add'){if(S.setup.nomes.length<10){S.setup.nomes.push('');render();}return true;}
  if(a==='z-del'){S.setup.nomes.splice(Number(v),1);render();return true;}
  if(a==='z-ok'){gerarSetup();return true;}
  if(a==='sql-copiar'){copiar(S.setup.sql).then(ok=>toast(ok?'SQL copiado':'Não consegui copiar. Selecione o texto e copie.'));return true;}
  if(a==='sql-copiar-cred'){copiar(S.setup.casas.map(c=>c.nome+'\nusuário: '+c.usuario+'\nsenha provisória: '+c.senha).join('\n\n')).then(ok=>toast(ok?'Lista copiada':'Não consegui copiar.'));return true;}
  if(a==='sql-copiar-rec'){copiar(S.setup.rec).then(ok=>toast(ok?'Código copiado':'Não consegui copiar.'));return true;}
  if(a==='sql-feito'){confirmarSql();return true;}
  return false;
}
async function salvarEdicao(){
  const p=W.p;
  try{
    await chk(rpc('app_set_perfil',{p_token:S.token,p_perfil:p}));
    await chk(rpc('app_set_meta',{p_token:S.token,p_meses:p.meses,p_prazo:p.prazo,p_inicio:p.inicio}));
    S.fluxo=null;await carregar(true);S.tab='inicio';render();toast('Plano recalculado');
  }catch(e){toast(e.message);}
}
function gerarSetup(){
  const Z=S.setup;const nomes=Z.nomes.map(x=>x.trim());
  if(nomes.some(x=>!x)){Z.erro='Dê um nome para cada casa.';render();return;}
  if(new Set(nomes.map(x=>x.toLowerCase())).size!==nomes.length){Z.erro='Há duas casas com o mesmo nome.';render();return;}
  Z.erro='';const us=usuariosUnicos(nomes);

 db:null,
 open(){return new Promise((ok,no)=>{if(IDB.db)return ok(IDB.db);let r;try{r=indexedDB.open('prov',1);}catch(e){return no(e);}r.onupgradeneeded=()=>{r.result.createObjectStore('docs',{keyPath:'id'});};r.onsuccess=()=>{IDB.db=r.result;ok(IDB.db);};r.onerror=()=>no(r.error);});},
 async tx(mode,fn){const db=await IDB.open();return new Promise((ok,no)=>{const t=db.transaction('docs',mode);const rq=fn(t.objectStore('docs'));t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>no(t.error);});},

 del(id){return IDB.tx('readwrite',s=>s.delete(id)).catch(()=>{});},
 keys(){return IDB.tx('readonly',s=>s.getAllKeys()).then(x=>x||[]).catch(()=>[]);},

function lerArquivo(file){return new Promise((ok,no)=>{
  if(file.type==='application/pdf'){
    if(file.size>3500000)return no(new Error('O PDF é grande demais (máximo 3,5 MB). Tire uma foto do documento ou reduza o arquivo.'));
    const fr=new FileReader();fr.onload=()=>ok({mime:'application/pdf',b64:String(fr.result).split(',')[1],tam:file.size});fr.onerror=()=>no(new Error('Não consegui ler o arquivo.'));fr.readAsDataURL(file);return;
  }
  if(!/^image\//.test(file.type))return no(new Error('Envie uma foto ou um PDF.'));
  const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const M=1800;let w=img.naturalWidth,h=img.naturalHeight;const f=Math.min(1,M/Math.max(w,h));w=Math.max(1,Math.round(w*f));h=Math.max(1,Math.round(h*f));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);const d=c.toDataURL('image/jpeg',0.82);ok({mime:'image/jpeg',b64:d.split(',')[1],tam:Math.round(d.length*0.75)});};
  img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Não consegui abrir esta imagem.'));};img.src=u;
});}

    if(S.tab==='emerg'&&!(S.alerta&&S.alerta.ativo))S.tab='inicio';
    if(S.tab==='casas'&&MODO==='local')S.tab='inicio';
    if(S.tab==='inicio')t=telaInicio();else if(S.tab==='lista')t=telaLista();else if(S.tab==='guardar')t=telaGuardar();else if(S.tab==='docs')t=telaDocs();else if(S.tab==='casas')t=telaCasas();else if(S.tab==='emerg')t=telaEmerg();else t=telaConta();
    h='<div class="shell">'+(S.offline?'<div class="offb">Sem internet. Mostrando o que está guardado neste celular.</div>':'')+t+navbar()+(S.tab==='emerg'?'':fab())+'</div>'+(S.alertaModal?modalAlerta():'')+(S.reg?modalReg():'')+(S.docForm?modalDoc():'')+(S.saudeEd?modalSaude():'')+(S.visor?modalVisor():'')+(S.reenvio?modalReenvio():'');
  }
  if(S.toast)h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  document.getElementById('app').innerHTML=h;
  if(S.alertaModal&&!guarda){const m=document.getElementById('al-s');if(m)m.focus();}
  if(S.reg&&S.reg.novo){S.reg.novo=false;const m=document.getElementById('reg-q');if(m){m.focus();m.select();}}
  if(guarda){const n=document.getElementById(guarda.id);if(n){n.value=guarda.v;try{n.focus();n.setSelectionRange(guarda.s,guarda.s);}catch(e){}}}
}

document.addEventListener('submit',async ev=>{
  const f=ev.target;
  if(f.id==='f-alerta'){
    ev.preventDefault();S.erro='';
    const ativar=S.alertaModal==='ativar';const senha=document.getElementById('al-s')?document.getElementById('al-s').value:'';
    try{
      const r=await rpc('app_alerta',{p_token:S.token,p_senha:senha,p_ativar:ativar});
      if(r.erro){S.erro=r.erro;render();return;}
      S.alertaModal=null;await carregar(true);S.tab=ativar?'emerg':'inicio';render();toast(ativar?'Alerta ativado':'Alerta desativado');
    }catch(e){S.erro=e.message;render();}
    return;
  }
  if(f.id==='f-conectar'){ev.preventDefault();conectarSubmit();return;}
  if(f.id==='f-recup'){
    ev.preventDefault();S.erro='';const cod=document.getElementById('rc-cod').value,nova=document.getElementById('rc-nova').value;S.busy=true;render();
    try{const r=await rpc('app_recuperar',{p_codigo:cod,p_nova:nova});
      S.busy=false;if(r&&r.erro){S.erro=r.erro;render();return;}
      S.recup=false;await entrar(r.usuario,nova);
    }catch(e){S.busy=false;S.erro=e.message;render();}
    return;
  }
  if(f.id==='f-login'){ev.preventDefault();entrar(document.getElementById('u').value,document.getElementById('s').value);}
  if(f.id==='f-senha'){
    ev.preventDefault();S.erro='';
    const a=document.getElementById('sa').value,n=document.getElementById('sn').value,r=document.getElementById('sr').value;
    if(n!==r){S.erro='As senhas novas não são iguais.';render();return;}
    try{const res=await rpc('app_trocar_senha',{p_token:S.token,p_atual:a,p_nova:n});if(res.erro){S.erro=res.erro;render();}else{S.erro='';const era=S.me&&S.me.trocar;await carregar();if(era){S.tab='inicio';render();}toast('Senha alterada');}}
    catch(e){S.erro=e.message;render();}
  }
});

document.addEventListener('change',async ev=>{
  const t=ev.target;if(!t||!S.docForm)return;
  const F=S.docForm;
  if(t.id==='df-file'&&t.files&&t.files[0]){
    const file=t.files[0];
    try{const r=await lerArquivo(file);F.b64=r.b64;F.mime=r.mime;F.tam=r.tam;F.fileNome=file.name||'Foto';F.erro='';}
    catch(e){F.erro=e.message;F.b64=null;F.fileNome='';}
    render();
  }
  else if(t.id==='df-pessoa'){F.pessoa=t.value;}
  else if(t.id==='df-tipo'){
    const antes=TIPOS[F.tipo];F.tipo=t.value;if(!F.titulo||F.titulo===antes)F.titulo=TIPOS[F.tipo];
    if(FIXOS.includes(F.tipo))F.lib=true;render();
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t&&t.id==='w-nome'&&W)W.p.casaNome=t.value;
  if(t&&t.dataset&&t.dataset.zc!==undefined&&S.setup)S.setup.nomes[Number(t.dataset.zc)]=t.value;
  if(t&&t.id==='df-titulo'&&S.docForm){S.docForm.titulo=t.value;}
  if(t&&S.saudeEd){
    const E=S.saudeEd;
    if(t.dataset&&t.dataset.f)E[t.dataset.f]=t.value;
    else if(t.dataset&&t.dataset.xk!==undefined)E.extras[Number(t.dataset.xk)].k=t.value;
    else if(t.dataset&&t.dataset.xv!==undefined)E.extras[Number(t.dataset.xv)].v=t.value;
  }
  if(t&&t.id==='reg-q'&&S.reg){S.reg.val=t.value;const pv=document.getElementById('reg-pv');if(pv)pv.textContent=regPrev();}
});

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(fluxoClick(a,b))return;
  if(await extraClick(a,b,v))return;
  if(a==='tab'){S.tab=v;S.erro='';render();window.scrollTo(0,0);}
  else if(a==='mes'){S.mes=v;
    if(S.me&&S.me.admin&&!casaAtiva(S.casas.find(c=>c.id===S.casaId)||{},v)){const at=ativas(v);if(at.length&&!at.some(c=>c.id===S.casaId))S.casaId=at[0].id;}
    render();}
  else if(a==='casa'){S.casaId=Number(v);render();}
  else if(a==='sub'){S.sub=v;render();}
  else if(a==='dsub'){S.dsub=v;S.delDoc=null;render();if(v!=='orient')carregarDocs().then(()=>{if(!formAberto())render();});}
  else if(a==='arq-vista'){S.arqVista=v;render();}
  else if(a==='arq-pessoa'){S.arqPessoa=decodeURIComponent(v);S.delDoc=null;render();}
  else if(a==='arq-casa'){S.arqCasa=Number(v);render();}
  else if(a==='docs-grupo'){S.tab='docs';S.dsub='arq';S.arqVista='grupo';render();window.scrollTo(0,0);}
  else if(a==='saude-ir'){S.tab='docs';S.dsub='saude';render();window.scrollTo(0,0);}
  else if(a==='doc-abrir'){await abrirDoc(v);}
  else if(a==='doc-lib'){
    const d=S.docs.find(x=>x.id===v);if(!d)return;
    try{const r=await rpc('app_doc_liberar',{p_token:S.token,p_id:v,p_lib:!d.liberado});if(r&&r.erro){toast(r.erro);return;}d.liberado=!d.liberado;render();carregarDocs();}
    catch(e){toast(e.message);}
  }
  else if(a==='doc-off'){await guardarCel(v,!S.off[v]);}
  else if(a==='doc-del'){S.delDoc=v;render();}
  else if(a==='doc-del-no'){S.delDoc=null;render();}
  else if(a==='doc-del-ok'){
    try{const r=await rpc('app_doc_apagar',{p_token:S.token,p_id:v});if(r&&r.erro){toast(r.erro);return;}await IDB.del(v);delete S.off[v];S.delDoc=null;await carregarDocs();render();toast('Documento apagado');}
    catch(e){toast(e.message);}
  }
  else if(a==='doc-novo'){
    const t=b.dataset.t;const p=b.dataset.p?decodeURIComponent(b.dataset.p):(minhas()[0]?minhas()[0].pessoa:'');
    S.docForm={tipo:t,pessoa:t==='bem'?'':p,titulo:TIPOS[t],lib:false,off:true,b64:null,mime:'',tam:0,fileNome:'',erro:'',busy:false};render();
  }
  else if(a==='doc-cancel'){S.docForm=null;render();}
  else if(a==='df-lib'){if(S.docForm){S.docForm.lib=!S.docForm.lib;render();}}
  else if(a==='df-off'){if(S.docForm){S.docForm.off=!S.docForm.off;render();}}
  else if(a==='doc-enviar'){await docEnviar();}
  else if(a==='visor-fechar'){if(S.visor){try{URL.revokeObjectURL(S.visor.url);}catch(e){}}S.visor=null;render();}
  else if(a==='saude-ok'){
    const p=minhas()[Number(v)];if(!p)return;
    try{const r=await rpc('app_saude_ok',{p_token:S.token,p_pessoa:p.pessoa});if(r&&r.erro){toast(r.erro);return;}await carregarDocs();render();toast('Revisado');}
    catch(e){toast(e.message);}
  }
  else if(a==='saude-edit'){
    const p=minhas()[Number(v)];if(!p)return;
    S.saudeEd={novo:false,nome:p.pessoa,sangue:p.sangue||'',alergias:p.alergias||'',doencas:p.doencas||'',pode:p.pode||'',nao_pode:p.nao_pode||'',extras:(p.extras||[]).map(x=>({k:x.k,v:x.v})),erro:'',busy:false};S.delPessoa=false;render();
  }
  else if(a==='saude-nova'){S.saudeEd={novo:true,nome:'',sangue:'',alergias:'',doencas:'',pode:'',nao_pode:'',extras:[],erro:'',busy:false};S.delPessoa=false;render();}
  else if(a==='saude-cancel'){S.saudeEd=null;S.delPessoa=false;render();}
  else if(a==='saude-x-add'){if(S.saudeEd&&S.saudeEd.extras.length<12){S.saudeEd.extras.push({k:'',v:''});render();}}
  else if(a==='saude-x-del'){if(S.saudeEd){S.saudeEd.extras.splice(Number(v),1);render();}}
  else if(a==='saude-rem'){S.delPessoa=true;render();}
  else if(a==='saude-rem-no'){S.delPessoa=false;render();}
  else if(a==='saude-rem-ok'){
    const E=S.saudeEd;if(!E)return;
    try{const r=await rpc('app_saude_remover',{p_token:S.token,p_pessoa:E.nome});if(r&&r.erro){toast(r.erro);return;}S.saudeEd=null;S.delPessoa=false;await carregarDocs();render();toast('Pessoa removida');}
    catch(e){toast(e.message);}
  }
  else if(a==='saude-salvar'){
    const E=S.saudeEd;if(!E||E.busy)return;
    const nome=(E.nome||'').trim();
    if(!nome){E.erro='Informe o nome.';render();return;}
    if(E.novo&&minhas().some(p=>p.pessoa.toLowerCase()===nome.toLowerCase())){E.erro='Já existe uma pessoa com esse nome.';render();return;}
    const extras=E.extras.filter(x=>(x.k||'').trim()&&(x.v||'').trim()).map(x=>({k:x.k.trim(),v:x.v.trim()}));
    E.busy=true;E.erro='';render();
    try{
      const r=await rpc('app_saude_salvar',{p_token:S.token,p_pessoa:nome,p_alergias:E.alergias,p_doencas:E.doencas,p_pode:E.pode,p_nao_pode:E.nao_pode,p_sangue:E.sangue,p_extras:extras});
      if(r&&r.erro){E.erro=r.erro;E.busy=false;render();return;}
      S.saudeEd=null;await carregarDocs();render();toast('Salvo');
    }catch(e){E.erro=e.message;E.busy=false;render();}
  }
  else if(a==='sair'){sair(false);}
  else if(a==='reg'){
    const id=b.dataset.i;const k=b.dataset.k;const it=(S.sub==='comprar'?linhas(S.mes).lista:itensEstoque()).find(x=>x.id===id);if(!it)return;
    const st=estado(it);
    const falta=r3(Math.max(st.comprar,(it.T||0)-st.c));
    const lim={comprar:falta,guardar:st.comprado,usar:st.armazenado,'v-comprar':st.comprado,'v-guardar':st.armazenado,'v-usar':st.usado}[k];
    if(!(lim>0))return;
    const ini=k==='comprar'?Math.min(st.comprar,lim):lim;
    S.reg={m:MES_ST,id:id,acao:k,lim:lim,q0:st.comprar,step:it.step,un:it.un,nome:it.nome,val:fmtIn(ini),novo:true};render();
  }
  else if(a==='meta-abrir'){S.metaEd={meses:META.meses,prazo:META.prazo,inicio:META.inicio,passo:'editar'};render();}
  else if(a==='meta-cancel'){S.metaEd=null;render();}
  else if(a==='meta-voltar'){if(S.metaEd){S.metaEd.passo='editar';render();}}
  else if(a==='meta-preset'){if(S.metaEd){S.metaEd.meses=Number(b.dataset.m);S.metaEd.prazo=Number(b.dataset.p);render();}}
  else if(a==='meta-d'){
    const E=S.metaEd;if(!E)return;const d=Number(b.dataset.d),k=b.dataset.k;
    if(k==='meses')E.meses=Math.max(1,Math.min(24,E.meses+d));
    else if(k==='prazo')E.prazo=Math.max(1,Math.min(24,E.prazo+d));
    else{const n=somaMes(E.inicio,d);if(n>=somaMes(hojeMes(),-1)&&n<=somaMes(hojeMes(),24))E.inicio=n;}
    render();
  }
  else if(a==='meta-rever'){if(S.metaEd){S.metaEd.passo='confirmar';render();}}
  else if(a==='meta-ok'){
    const E=S.metaEd;if(!E)return;
    try{const r=await rpc('app_set_meta',{p_token:S.token,p_meses:E.meses,p_prazo:E.prazo,p_inicio:E.inicio});
      if(r&&r.erro){toast(r.erro);return;}
      META={meses:E.meses,prazo:E.prazo,inicio:E.inicio};montarMeses();S.metaEd=null;
      S.mes=defaultMes();render();toast('Meta recalculada');}
    catch(e){toast(e.message);}
  }
  else if(a==='reg-fechar'){S.reg=null;render();}
  else if(a==='reg-step'){
    const R=S.reg;if(!R)return;const x=lerQtd(R.val,R.step,R.lim);let q=x.ok?x.q:R.lim;
    q=r3(Math.max(R.step,Math.min(R.lim,q+Number(b.dataset.d)*R.step)));R.val=fmtIn(q);render();
  }
  else if(a==='reg-ok'){
    const R=S.reg;if(!R)return;const x=lerQtd(R.val,R.step,R.lim);
    if(!x.ok){toast('Informe uma quantidade maior que zero.');return;}
    if(x.acima){R.val=fmtIn(R.lim);render();return;}
    const ok=await mover(R.m,R.id,R.acao,x.q);if(ok){S.reg=null;render();toast('Salvo');}
  }
  else if(a==='tickg'){const on=tickG(v);await mover(MES_EMERG,v,on?'v-comprar':'comprar',1);}
  else if(a==='tick'){const m=b.dataset.m;const on=tick(m,v);gravar(m,v,on?0:1,0,0);}
  else if(a==='alerta-abrir'){S.alertaModal='ativar';S.erro='';render();}
  else if(a==='alerta-desativar'){S.alertaModal='desativar';S.erro='';render();}
  else if(a==='alerta-fechar'){S.alertaModal=null;S.erro='';render();}
  else if(a==='comprou'){await comprarTudo(b.dataset.i);}
  else if(a==='ativar'){S.confirm=Number(v);S.reset=null;render();}
  else if(a==='ativar-no'){S.confirm=null;render();}
  else if(a==='ativar-ok'){
    const id=Number(v);const c=S.casas.find(x=>x.id===id);const ligada=!!c.desde&&!c.ate;
    const base=hojeMes()<MESES[0].id?MESES[0].id:hojeMes();const prox=proxMes(base);
    let desde,ate;
    if(ligada){desde=c.desde;ate=base;}else{desde=prox;ate=null;}
    S.confirm=null;
    try{await rpc('app_set_casa',{p_token:S.token,p_casa:id,p_desde:desde,p_ate:ate});await carregar();toast(ligada?'Casa desativada a partir do próximo mês':'Casa ativada a partir do próximo mês');}
    catch(e){toast(e.message);}
  }
  else if(a==='reset'){S.reset=Number(v);S.confirm=null;render();}
  else if(a==='reset-no'){S.reset=null;render();}
  else if(a==='reset-ok'){
    const id=Number(v);const n=document.getElementById('np-'+id).value;
    try{const res=await rpc('app_redefinir_senha',{p_token:S.token,p_casa:id,p_nova:n});if(res.erro){toast(res.erro);}else{S.reset=null;render();toast('Senha redefinida');}}
    catch(e){toast(e.message);}
  }
});

setInterval(()=>{
  if(!S.token||!S.me||document.hidden||MODO==='local'||S.fluxo||S.reenvio)return;
  const a=document.activeElement;if((a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||formAberto())return;
  const antes=!!(S.alerta&&S.alerta.ativo);
  carregar(true).then(()=>{
    const dep=!!(S.alerta&&S.alerta.ativo);
    if(dep&&!antes){S.tab='emerg';S.alertaModal=null;S.toast='Alerta ativado por '+(S.alerta.por||'uma casa');}
    else if(!dep&&antes){if(S.tab==='emerg')S.tab='inicio';S.toast='Alerta desativado';}
    const ae=document.activeElement;if(!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))&&!formAberto())render();
  });
},15000);

try{if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}catch(e){}
lerConvite();
if(MODO==='local'){
  const L=Lget();
  if(L&&L.perfil){S.token='local';setPerfil(L.perfil);META={meses:L.meta.meses,prazo:L.meta.prazo,inicio:L.meta.inicio};montarMeses();S.mes=defaultMes();render();carregar();}
  else{MODO=null;lsDel('prov_modo');S.fluxo='boas';render();}
}else if(MODO==='shared'&&CONN){render();if(S.token)carregar();}
else{MODO=null;S.fluxo='boas';render();}
</script>
